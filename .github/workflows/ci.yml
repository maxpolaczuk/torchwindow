name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy

      - name: Install package (no GPU deps)
        # CI has no CUDA driver; install only what we need for validation
        # tests. The full package install is exercised on GPU runners.
        run: pip install -e . --no-deps

      - name: Ruff
        run: ruff check torchwindow tests

      - name: Mypy
        run: mypy torchwindow/_validate.py

      - name: Pytest
        run: pytest tests -v

[tool.poetry]
name = "torchwindow"
version = "1.1.0"
description = "Display tensors directly from GPU"
authors = ["Jeremy <jbaron34@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jbaron34/torchwindow"
repository = "https://github.com/jbaron34/torchwindow"
packages = [{ include = "torchwindow" }]

[tool.poetry.dependencies]
python = "^3.8"
pysdl2 = "^0.9.14"
pysdl2-dll = "^2.24.1"
numpy = "^1.23.4"
pyopengl = "^3.1.6"
cuda-python = ">=11.8.0,<13.0.0"
pyobjc-framework-Metal = { version = ">=9.0", optional = true, markers = "sys_platform == 'darwin'" }
pyobjc-framework-Cocoa = { version = ">=9.0", optional = true, markers = "sys_platform == 'darwin'" }
pyobjc-framework-Quartz = { version = ">=9.0", optional = true, markers = "sys_platform == 'darwin'" }

[tool.poetry.extras]
mps = ["pyobjc-framework-Metal", "pyobjc-framework-Cocoa", "pyobjc-framework-Quartz"]


[tool.poetry.group.dev.dependencies]
black = { version = "^22.10.0", allow-prereleases = true }
pytest = "^8.0"
ruff = "^0.5"
mypy = "^1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
